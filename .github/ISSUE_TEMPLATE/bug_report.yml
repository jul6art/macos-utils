name: Bug report
description: A script fails, or a utility does not do what its doc says
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. These are shell scripts and a small Swift app, so
        the command you ran plus its output is usually the whole story.

        **Do not report a security problem here** — use
        [private vulnerability reporting](https://github.com/jul6art/macos-utils/security/advisories/new)
        instead, as described in [SECURITY.md](https://github.com/jul6art/macos-utils/blob/master/.github/SECURITY.md).
        Note that unsigned, un-notarized builds are a documented consequence
        here, not a defect.
  - type: dropdown
    id: utility
    attributes:
      label: Which utility
      options:
        - Custom macOS App (appify.sh / custom_macos_app.sh)
        - Awake
        - the documentation
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: The command you ran
      placeholder: sh data/sources/awake/build.sh --install
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: What it printed
      description: The full output, including the error.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      description: Apple menu → About This Mac, or `sw_vers -productVersion`.
      placeholder: "15.3"
    validations:
      required: true
  - type: dropdown
    id: arch
    attributes:
      label: Architecture
      options:
        - Apple silicon
        - Intel
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I have the Command Line Tools installed (`xcode-select -p` answers)
          required: false
        - label: I read the utility's doc under `data/doc/` and followed it
          required: true
